<!DOCTYPE html>
<html lang="ja">

<head>

    <!-- ==========================================
         Basic
    =========================================== -->

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">


    <title>404 | Kob_asan</title>


    <meta name="description"
          content="Kob_asanの404ページ。ページが見つかりませんでした。">


    <meta name="theme-color"
          content="#090B0F">


    <meta name="color-scheme"
          content="dark">


    <!-- ==========================================
         Font
    =========================================== -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"

    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+1:wght@100..900&display=swap"

    <!-- ==========================================

    =========================================== -->


    <link rel="stylesheet"

<main class="p-error">


    <section class="p-error__container">


        <div class="p-error__visual">


            <p class="p-error__code">
                404
            </p>


            <div class="p-error__line"></div>


        </div>



        <div class="p-error__content">


            <span class="p-error__label">
                ERROR
            </span>


            <h1>
                Page Not Found
            </h1>


            <p>
                探しているページは見つかりませんでした。
            </p>


            <p class="p-error__message">

                切り替えて次ですね。

            </p>



            <div class="p-error__actions">


                <a href="index.html"
                   class="c-button c-button--primary">

                    Homeへ戻る

                </a>



                <a href="search.html"
                   class="c-button c-button--ghost">

                    検索する

                </a>


            </div>


        </div>


    </section>

<!-- JavaScript -->

<script src="assets/js/core/config.js"></script>
